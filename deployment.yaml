apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-web
  template:
    metadata:
      labels:
        app: gitops-web
    spec:
      containers:
        - name: web
          image: web-image-placeholder
          ports:
            - containerPort: 8080
